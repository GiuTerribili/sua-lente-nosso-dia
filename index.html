<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giulia & Nathan</title>

    <!-- Fontes da identidade do casamento -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #fffaf6;
            color: #514943;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 25px;
            position: relative;
            overflow: hidden;
        }

        .content {
            width: 100%;
            max-width: 650px;
            position: relative;
            z-index: 2;
        }

        /* TEXTO SUPERIOR */

        .intro {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #77706a;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* NOMES */

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(70px, 16vw, 115px);
            font-weight: 400;
            line-height: 0.95;
            color: #A87932;
            margin-bottom: 18px;
        }

        /* DATA */

        .date {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: #655c55;
            margin-bottom: 45px;
            font-weight: 500;
        }

        /* MENSAGEM */

        .message {
            font-size: 15px;
            line-height: 1.9;
            color: #625a55;
            max-width: 470px;
            margin: 0 auto 38px;
            font-weight: 400;
        }

        /* BOTÃO */

        .button {
            display: inline-block;
            padding: 17px 32px;
            border-radius: 50px;

            background: #D9577A;
            color: #ffffff;

            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 1.6px;
            font-weight: 600;

            box-shadow: 0 8px 25px rgba(217, 87, 122, 0.20);

            transition: all 0.3s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(217, 87, 122, 0.30);
        }

        /* FRASE FINAL */

        .footer {
            margin-top: 45px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9a918a;
        }

        /* ELEMENTOS DECORATIVOS */

        .decor {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        /*
        Estes elementos são temporários.
        Depois vamos substituir pelos hibiscos
        reais em aquarela.
        */

        .pink-detail {
            width: 180px;
            height: 180px;
            top: -70px;
            left: -70px;

            background:
                radial-gradient(
                    circle,
                    rgba(217, 87, 122, 0.18) 0%,
                    rgba(217, 87, 122, 0.08) 45%,
                    transparent 70%
                );

            border-radius: 50%;
        }

        .orange-detail {
            width: 220px;
            height: 220px;
            bottom: -100px;
            right: -90px;

            background:
                radial-gradient(
                    circle,
                    rgba(235, 121, 72, 0.18) 0%,
                    rgba(235, 121, 72, 0.08) 45%,
                    transparent 70%
                );

            border-radius: 50%;
        }

        /* LINHAS DECORATIVAS */

        .line {
            width: 55px;
            height: 1px;
            background: #A87932;
            opacity: 0.55;
            margin: 0 auto 25px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 40px 22px;
            }

            h1 {
                font-size: 76px;
            }

            .date {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .message {
                font-size: 14px;
                padding: 0 10px;
            }

            .button {
                width: 100%;
                max-width: 310px;
                padding: 18px 20px;
            }

            .pink-detail {
                width: 140px;
                height: 140px;
                top: -50px;
                left: -50px;
            }

            .orange-detail {
                width: 160px;
                height: 160px;
                bottom: -70px;
                right: -60px;
            }
        }

    </style>
</head>

<body>

    <main class="page">

        <!-- Decoração temporária -->
        <div class="decor pink-detail"></div>
        <div class="decor orange-detail"></div>

        <section class="content">

            <p class="intro">
                Nosso casamento
            </p>

            <div class="line"></div>

            <h1>
                Giulia & Nathan
            </h1>

            <p class="date">
                20 · 03 · 2027
            </p>

            <p class="message">
                Queremos viver o nosso casamento através dos seus olhos.
                <br>
                Fotografe, compartilhe e faça parte das nossas memórias.
            </p>

            <a href="#" class="button">
                📸 &nbsp; COMPARTILHE SUA FOTO
            </a>

            <p class="footer">
                Com amor, Giulia & Nathan
            </p>

        </section>

    </main>

</body>
</html>
