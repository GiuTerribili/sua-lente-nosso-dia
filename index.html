<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giulia & Nathan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #f8f3ed;
            color: #4b4b42;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 50px 25px;
        }

        .small-text {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #77776d;
        }

        h1 {
            font-size: 58px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .date {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 35px;
        }

        .message {
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            background: #6f7565;
            color: white;
            padding: 16px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            color: #99998e;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small-text">
            Nosso casamento
        </div>

        <h1>Giulia & Nathan</h1>

        <div class="date">
            20.03.2027
        </div>

        <p class="message">
            Queremos viver o nosso casamento através dos seus olhos.
            <br><br>
            Fotografe, compartilhe e faça parte das nossas memórias.
        </p>

        <a href="#" class="button">
            📸 Compartilhar uma foto
        </a>

        <div class="footer">
            Com amor, Giulia & Nathan
        </div>

    </div>

</body>
</html>
