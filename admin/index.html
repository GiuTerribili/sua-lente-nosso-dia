<title>Administração — Giulia & Nathan</title>

<link

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #fffaf6;
        color: #514943;
        font-family: 'Montserrat', sans-serif;
    }

    .page {
        width: 100%;
        max-width: 1200px;
        margin: auto;
        padding: 35px 25px 60px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 35px;
    }

    .title {
        font-family: 'Great Vibes', cursive;
        font-size: 52px;
        font-weight: 400;
        color: #A87932;
    }

    .subtitle {
        margin-top: 5px;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #9a918a;
    }

    .logout {
        border: none;
        border-radius: 50px;
        padding: 12px 20px;
        background: #eee5df;
        color: #655c55;
        font-family: 'Montserrat', sans-serif;
        font-size: 10px;
        letter-spacing: 1px;
        font-weight: 600;
        cursor: pointer;
    }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    .counter {
        font-size: 12px;
        color: #77706a;
    }

    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .action {
        border: none;
        border-radius: 50px;
        padding: 13px 18px;
        font-family: 'Montserrat', sans-serif;
        font-size: 10px;
        letter-spacing: 1px;
        font-weight: 600;
        cursor: pointer;
    }

    .select-all {
        background: #eee5df;
        color: #655c55;
    }

    .download {
        background: #A87932;
        color: white;
    }

    .delete {
        background: #D9577A;
        color: white;
    }

    .delete:disabled,
    .download:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    .photo-card {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 15px;
        overflow: hidden;
        background: #f3ebe5;
        cursor: pointer;
    }

    .photo-card.selected {
        outline: 4px solid #D9577A;
        outline-offset: -4px;
    }

    .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .check {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(255,255,255,0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        color: transparent;
        z-index: 2;
    }

    .photo-card.selected .check {
        background: #D9577A;
        color: white;
    }

    .photo-number {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 5px 8px;
        border-radius: 20px;
        background: rgba(45,35,30,0.65);
        color: white;
        font-size: 9px;
    }

    .status {
        text-align: center;
        padding: 35px 20px;
        font-size: 12px;
        color: #9a918a;
    }

    /* LOGIN */

    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
    }

    .login-box {
        width: 100%;
        max-width: 390px;
        background: white;
        padding: 40px 30px;
        border-radius: 25px;
        box-shadow: 0 15px 50px rgba(80,60,50,0.10);
        text-align: center;
    }

    .login-title {
        font-family: 'Great Vibes', cursive;
        font-size: 58px;
        color: #A87932;
        font-weight: 400;
    }

    .login-subtitle {
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #9a918a;
        margin: 10px 0 30px;
    }

    .input {
        width: 100%;
        border: 1px solid #e3d9d2;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 12px;
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        outline: none;
    }

    .login-button {
        width: 100%;
        border: none;
        border-radius: 50px;
        padding: 16px;
        margin-top: 8px;
        background: #D9577A;
        color: white;
        font-family: 'Montserrat', sans-serif;
        font-size: 10px;
        letter-spacing: 1.5px;
        font-weight: 600;
        cursor: pointer;
    }

    .login-error {
        min-height: 25px;
        margin-top: 15px;
        color: #D9577A;
        font-size: 11px;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 800px) {

        .gallery {
            grid-template-columns: repeat(3, 1fr);
        }

    }

    @media (max-width: 550px) {

        .page {
            padding: 25px 15px 50px;
        }

        .header {
            align-items: flex-start;
        }

        .title {
            font-size: 43px;
        }

        .gallery {
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .actions {
            width: 100%;
        }

        .action {
            flex: 1;
        }

    }

</style>

```
<!-- LOGIN -->

<section
    id="loginPage"
    class="login-page"
>

    <div class="login-box">

        <h1 class="login-title">
            Giulia & Nathan
        </h1>

        <p class="login-subtitle">
            Área da administradora
        </p>

        <input
            id="email"
            class="input"
            type="email"
            placeholder="Seu e-mail"
            autocomplete="email"
        >

        <input
            id="password"
            class="input"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
        >

        <button
            id="loginButton"
            class="login-button"
        >

        </button>

        <div
            id="loginError"

        ></div>

    </div>

</section>


<!-- ADMIN -->

<main
    id="adminPage"
    class="page hidden"
>

    <header class="header">

        <div>

            <h1 class="title">
                Nossas memórias
            </h1>

            <p class="subtitle">
                Painel da administradora
            </p>

        </div>

        <button
            id="logoutButton"
            class="logout"
        >
            SAIR
        </button>

    </header>


    <section class="toolbar">

        <div
            id="counter"
            class="counter"
        >
            Nenhuma foto selecionada
        </div>

        <div class="actions">

            <button
                id="selectAllButton"
                class="action select-all"
            >
                SELECIONAR TODAS
            </button>

            <button
                id="downloadButton"
                class="action download"
                disabled
            >
                BAIXAR SELECIONADAS
            </button>

            <button
                id="deleteButton"
                class="action delete"
                disabled
            >
                EXCLUIR SELECIONADAS
            </button>

        </div>

    </section>


    <section
        id="adminGallery"
        class="gallery"
    >

        <div class="status">
            Carregando fotos...
        </div>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        'https://jhembtsinuyailrdxrfq.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_WIFsYfO0rCvzThuhzXXg_dMzYbdHm';


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const loginPage =
        document.getElementById('loginPage');

    const adminPage =
        document.getElementById('adminPage');

    const emailInput =
        document.getElementById('email');

    const passwordInput =
        document.getElementById('password');

    const loginButton =
        document.getElementById('loginButton');

    const loginError =
        document.getElementById('loginError');

    const logoutButton =
        document.getElementById('logoutButton');

    const adminGallery =
        document.getElementById('adminGallery');

    const counter =
        document.getElementById('counter');

    const selectAllButton =
        document.getElementById('selectAllButton');

    const downloadButton =
        document.getElementById('downloadButton');

    const deleteButton =
        document.getElementById('deleteButton');


    let files = [];

    let selectedPaths = new Set();


    /* =========================================
       LOGIN
    ========================================= */

    loginButton.addEventListener(
        'click',
        login
    );


    passwordInput.addEventListener(
        'keydown',
        event => {

            if (event.key === 'Enter') {
                login();
            }

        }
    );


    async function login() {

        loginError.textContent =
            '';

        loginButton.disabled =
            true;

        loginButton.textContent =
            'ENTRANDO...';


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        emailInput.value.trim(),

                    password:
                        passwordInput.value

                });


        if (error) {

            console.error(error);

            loginError.textContent =
                'E-mail ou senha incorretos.';

            loginButton.disabled =
                false;

            loginButton.textContent =
                'ENTRAR';

            return;

        }


        if (!data.session) {

            loginError.textContent =
                'Não foi possível iniciar a sessão.';

            loginButton.disabled =
                false;

            loginButton.textContent =
                'ENTRAR';

            return;

        }


        showAdmin();

    }


    /* =========================================
       VERIFICAR SESSÃO
    ========================================= */

    async function checkSession() {

        const {
            data
        } =
            await supabaseClient
                .auth
                .getSession();


        if (data.session) {

            showAdmin();

        }

    }


    function showAdmin() {

        loginPage.classList.add(
            'hidden'
        );

        adminPage.classList.remove(
            'hidden'
        );

        loadAdminGallery();

    }


    /* =========================================
       SAIR
    ========================================= */

    logoutButton.addEventListener(
        'click',
        async function () {

            await supabaseClient
                .auth
                .signOut();

            selectedPaths.clear();

            adminPage.classList.add(
                'hidden'
            );

            loginPage.classList.remove(
                'hidden'
            );

        }
    );


    /* =========================================
       GALERIA ADMIN
    ========================================= */

    async function loadAdminGallery() {

        adminGallery.innerHTML =
            '<div class="status">Carregando fotos...</div>';

        selectedPaths.clear();

        updateToolbar();


        const {
            data,
            error
        } =
            await supabaseClient
                .storage
                .from('fotos-casamento')
                .list(
                    '',
                    {
                        limit: 1000,
                        offset: 0,
                        sortBy: {
                            column: 'created_at',
                            order: 'desc'
                        }
                    }
                );


        if (error) {

            console.error(error);

            adminGallery.innerHTML =
                '<div class="status">Não foi possível carregar as fotos.</div>';

            return;

        }


        files =
            (data || [])
                .filter(
                    file =>
                        file.name &&
                        !file.name.endsWith('/')
                );


        if (!files.length) {

            adminGallery.innerHTML =
                '<div class="status">' +
                'Ainda não existem fotos no casamento. 💕' +
                '</div>';

            return;

        }


        adminGallery.innerHTML = '';


        files.forEach(
            (file, index) => {

                const card =
                    document.createElement('div');

                card.className =
                    'photo-card';


                const image =
                    document.createElement('img');

                image.src =
                    supabaseClient
                        .storage
                        .from('fotos-casamento')
                        .getPublicUrl(
                            file.name
                        )
                        .data
                        .publicUrl;


                image.alt =
                    'Foto ' + (index + 1);


                const check =
                    document.createElement('div');

                check.className =
                    'check';

                check.textContent =
                    '✓';


                const number =
                    document.createElement('div');

                number.className =
                    'photo-number';

                number.textContent =
                    '#' + (index + 1);


                card.appendChild(image);

                card.appendChild(check);

                card.appendChild(number);


                card.addEventListener(
                    'click',
                    function () {

                        toggleSelection(
                            file.name,
                            card
                        );

                    }
                );


                adminGallery.appendChild(
                    card
                );

            }
        );

    }


    /* =========================================
       SELECIONAR / DESELECIONAR
    ========================================= */

    function toggleSelection(
        path,
        card
    ) {

        if (
            selectedPaths.has(path)
        ) {

            selectedPaths.delete(path);

            card.classList.remove(
                'selected'
            );

        } else {

            selectedPaths.add(path);

            card.classList.add(
                'selected'
            );

        }

        updateToolbar();

    }


    /* =========================================
       SELECIONAR TODAS
    ========================================= */

    selectAllButton.addEventListener(
        'click',
        function () {

            const allSelected =
                selectedPaths.size ===
                files.length;


            const cards =
                document.querySelectorAll(
                    '.photo-card'
                );


            if (allSelected) {

                selectedPaths.clear();

                cards.forEach(
                    card =>
                        card.classList.remove(
                            'selected'
                        )
                );

                selectAllButton.textContent =
                    'SELECIONAR TODAS';

            } else {

                files.forEach(
                    file =>
                        selectedPaths.add(
                            file.name
                        )
                );

                cards.forEach(
                    card =>
                        card.classList.add(
                            'selected'
                        )
                );

                selectAllButton.textContent =
                    'DESMARCAR TODAS';

            }

            updateToolbar();

        }
    );


    /* =========================================
       BARRA
    ========================================= */

    function updateToolbar() {

        const count =
            selectedPaths.size;


        if (count === 0) {

            counter.textContent =
                'Nenhuma foto selecionada';

        } else {

            counter.textContent =
                count +
                (
                    count === 1
                        ? ' foto selecionada'
                        : ' fotos selecionadas'
                );

        }


        downloadButton.disabled =
            count === 0;

        deleteButton.disabled =
            count === 0;


        if (
            files.length > 0 &&
            count === files.length
        ) {

            selectAllButton.textContent =
                'DESMARCAR TODAS';

        } else {

            selectAllButton.textContent =
                'SELECIONAR TODAS';

        }

    }


    /* =========================================
       DOWNLOAD
    ========================================= */

    downloadButton.addEventListener(
        'click',
        async function () {

            const paths =
                Array.from(
                    selectedPaths
                );


            if (!paths.length) {
                return;
            }


            downloadButton.disabled =
                true;

            downloadButton.textContent =
                'BAIXANDO...';


            try {

                for (
                    const path of paths
                ) {

                    const publicUrl =
                        supabaseClient
                            .storage
                            .from('fotos-casamento')
                            .getPublicUrl(
                                path
                            )
                            .data
                            .publicUrl;


                    const link =
                        document.createElement(
                            'a'
                        );

                    link.href =
                        publicUrl;

                    link.target =
                        '_blank';

                    link.download =
                        path;


                    document.body.appendChild(
                        link
                    );

                    link.click();

                    link.remove();


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                250
                            )
                    );

                }

            }

            finally {

                downloadButton.disabled =
                    selectedPaths.size === 0;

                downloadButton.textContent =
                    'BAIXAR SELECIONADAS';

            }

        }
    );


    /* =========================================
       EXCLUSÃO MÚLTIPLA
    ========================================= */

    deleteButton.addEventListener(
        'click',
        async function () {

            const paths =
                Array.from(
                    selectedPaths
                );


            if (!paths.length) {
                return;
            }


            const confirmed =
                window.confirm(
                    `Você está prestes a excluir ${paths.length} ${
                        paths.length === 1
                            ? 'foto'
                            : 'fotos'
                    } permanentemente.\n\nEssa ação não poderá ser desfeita.\n\nDeseja continuar?`
                );


            if (!confirmed) {
                return;
            }


            deleteButton.disabled =
                true;

            deleteButton.textContent =
                'EXCLUINDO...';


            try {

                const {
                    error
                } =
                    await supabaseClient
                        .storage
                        .from('fotos-casamento')
                        .remove(
                            paths
                        );


                if (error) {
                    throw error;
                }


                selectedPaths.clear();


                await loadAdminGallery();

            }

            catch (error) {

                console.error(
                    'ERRO AO EXCLUIR:',
                    error
                );


                alert(
                    'Não foi possível excluir as fotos. Verifique sua permissão de administradora.'
                );

            }

            finally {

                deleteButton.textContent =
                    'EXCLUIR SELECIONADAS';

                updateToolbar();

            }

        }
    );


    /* =========================================
       INICIAR
    ========================================= */

    checkSession();

</script>
